name: Rebuild snapshot

# The embedded snapshot is only a fallback for when the live fetch fails, but a
# stale fallback is worse than no fallback — it shows a confident number from
# weeks ago. Rebuilding on every trading day keeps the worst case fresh.
on:
  schedule:
    - cron: '30 9 * * 1-5'   # 16:30 ICT, after the VN close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run engine tests
        run: node tools/test-engine.js

      - name: Verify engine against saved fixtures
        run: node tools/build-snapshot.js --fixtures ./fixtures --dry-run

      - name: Rebuild snapshot from live data
        run: node tools/build-snapshot.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/snapshot.js; then
            echo "snapshot unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snapshot.js
          git commit -m "chore: rebuild snapshot $(date -u +%Y-%m-%d)"
          git push
